
name: DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "students/sivanna/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: students/sivanna

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: students/sivanna/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./students/sivanna
          file: ./students/sivanna/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-dashboard:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
