
name: DevOps Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - "students/sivanna/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devops-dashboard-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students/sivanna

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: students/sivanna/package-lock.json

      - run: npm ci
      - run: npm test

  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./students/sivanna
          file: ./students/sivanna/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-dashboard:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Terraform and EC2 Deployment
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_allowed_cidr: ${{ vars.TF_VAR_ALLOWED_CIDR }}
      AWS_REGION: eu-north-1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: students/sivanna/terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: students/sivanna/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: students/sivanna/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: students/sivanna/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Terraform Outputs
        id: infra
        working-directory: students/sivanna/terraform
        run: |
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "sg=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

      - name: Deploy application over SSH
        env:
          SERVER_IP: ${{ steps.infra.outputs.ip }}
          SECURITY_GROUP_ID: ${{ steps.infra.outputs.sg }}
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\r\n')"

          if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Invalid runner IP"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

          echo "Authorizing temporary SSH access..."

          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"

          cleanup() {
            echo "Removing temporary SSH access..."
            aws ec2 revoke-security-group-ingress \
              --group-id "$SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_IP/32" || true

            rm -f ~/.ssh/ec2-key.pem
          }

          trap cleanup EXIT

          SSH_OPTS=(
            -i ~/.ssh/ec2-key.pem
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=10
            -o BatchMode=yes
          )

          echo "Waiting for SSH..."

          READY=0
          for i in $(seq 1 40); do
            if ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" "true"; then
              READY=1
              break
            fi
            sleep 15
          done

          if [ "$READY" -ne 1 ]; then
            echo "SSH connection failed"
            exit 1
          fi

          echo "Waiting for Docker installation..."

          ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" \
            "sudo cloud-init status --wait && test -f /var/tmp/docker-ready && sudo docker compose version"

          echo "Preparing deployment directory..."

          ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" \
            "mkdir -p ~/devops-dashboard && chmod 700 ~/devops-dashboard"

          scp "${SSH_OPTS[@]}" \
            students/sivanna/docker-compose.prod.yml \
            "ubuntu@$SERVER_IP:~/devops-dashboard/docker-compose.prod.yml"

          echo "Preparing environment file..."

          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "DOCKER_USERNAME": os.environ["DOCKER_USERNAME"],
              "IMAGE_TAG": os.environ["IMAGE_TAG"],
              "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": os.environ["POSTGRES_PASSWORD"],
              "POSTGRES_DB": "devops_dashboard",
          }

          def quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          content = "\n".join(
              f"{key}={quote(value)}" for key, value in values.items()
          ) + "\n"

          path = Path("/tmp/dashboard-deploy.env")
          path.write_text(content)
          path.chmod(0o600)
          PY

          scp "${SSH_OPTS[@]}" \
            /tmp/dashboard-deploy.env \
            "ubuntu@$SERVER_IP:~/devops-dashboard/.env"

          rm -f /tmp/dashboard-deploy.env

          ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" \
            "chmod 600 ~/devops-dashboard/.env"

          echo "Starting containers..."

          ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" \
            "cd ~/devops-dashboard && sudo docker compose -f docker-compose.prod.yml pull && sudo docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans"

          echo "Checking application..."

          ssh "${SSH_OPTS[@]}" "ubuntu@$SERVER_IP" \
            'for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/api/status; then exit 0; fi; sleep 5; done; exit 1'

          echo "Deployment successful!"
