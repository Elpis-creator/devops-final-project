
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Deployment Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 50px 20px;
    }
    main { max-width: 900px; margin: auto; }
    h1 { font-size: 32px; }
    p { color: #94a3b8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 35px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 25px;
    }
    .label { color: #94a3b8; font-size: 14px; }
    .value { font-size: 23px; margin-top: 12px; }
    .success { color: #4ade80; }
    .error { color: #fb7185; }
    footer { margin-top: 40px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>DevOps Deployment Dashboard</h1>
    <p>Node.js · PostgreSQL · Docker · Terraform · GitHub Actions</p>

    <div class="grid">
      <div class="card">
        <div class="label">Application</div>
        <div class="value" id="app">Checking...</div>
      </div>
      <div class="card">
        <div class="label">PostgreSQL</div>
        <div class="value" id="database">Checking...</div>
      </div>
      <div class="card">
        <div class="label">Deployment version</div>
        <div class="value" id="version">Checking...</div>
      </div>
    </div>

    <footer id="updated">Waiting for status...</footer>
  </main>

  <script>
    async function refreshStatus() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error('API unavailable');

        const data = await response.json();

        document.getElementById('app').textContent = data.status;
        document.getElementById('app').className = 'value success';

        document.getElementById('database').textContent = data.database;
        document.getElementById('database').className =
          data.database === 'connected' ? 'value success' : 'value error';

        document.getElementById('version').textContent = data.version;
        document.getElementById('updated').textContent =
          'Last checked: ' + new Date(data.timestamp).toLocaleString();
      } catch (error) {
        document.getElementById('app').textContent = 'unavailable';
        document.getElementById('app').className = 'value error';
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 10000);
  </script>
</body>
</html>
